name: licurici
description: Licurici - jocuri educative pentru copii (gradinita + clasele 1-4).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  licurici_core:
    path: ../../packages/licurici_core
  game_content:
    path: ../../packages/game_content
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.2.0
  audioplayers: ^6.5.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  http: ^1.6.0
  pdf: ^3.13.1
  printing: ^5.15.1
  image_picker: ^1.2.4
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
