# Mediul de dezvoltare Licurici (README §18).
#   cp infra/.env.example infra/.env   # completează parolele
#   docker compose -f infra/docker-compose.yml up -d --build
# Aplicația Flutter NU rulează în Docker — rulează pe dispozitiv/emulator.

name: licurici

x-backend: &backend
  build:
    context: ../backend
    target: runtime
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    S3_ENDPOINT: http://storage:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    # E-mailurile din dezvoltare ajung în Mailpit (http://localhost:8025).
    SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    storage: { condition: service_started }
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # AOF = persistența job-urilor; noeviction = cerința BullMQ (nu pierdem job-uri sub presiune).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # Stocare S3-compatibilă pentru dezvoltare (ADR-15). Imaginea comunitară MinIO nu mai e
  # publicată pe Docker Hub; RustFS e compatibil S3/MinIO (Apache-2.0). Producția: S3 administrat în UE.
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: [storagedata:/data]
    ports: ["127.0.0.1:9000:9000"]
    restart: unless-stopped

  # Rulează migrările o dată, apoi se oprește; api/worker pornesc doar după succesul lui.
  migrate:
    build:
      context: ../backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    ports: ["127.0.0.1:3000:3000"]

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true

  # Cozile BullMQ în browser: http://localhost:3001 (utilizator admin, parola BULLBOARD_PASSWORD).
  bullboard:
    <<: *backend
    command: ["node", "dist/bullboard.js"]
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      disable: true

  # Prinde toate e-mailurile trimise în dezvoltare: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
