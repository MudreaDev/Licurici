name: game_content
description: Continutul aplicatiei Licurici - ilustratii OpenMoji, voce, fonturi, date de joc.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - art/openmoji/
    - art/illustrations/mascot/
    - art/illustrations/domains/
    - art/illustrations/games/
    - art/illustrations/sprites/
    - art/illustrations/rewards/
    - art/illustrations/scenes/
    - art/illustrations/faces/
    - art/illustrations/objects/
    - art/illustrations/actions/
    - art/illustrations/parts/
    - audio/ro/
    - audio/sfx/
    - audio/music/
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
